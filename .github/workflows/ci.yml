name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Codecov OIDC tokenless upload
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Type check
        run: uv run ty check epidash/

      - name: Run tests
        run: uv run pytest -v --cov=epidash --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (with browser tooling)
        run: uv sync --group e2e

      - name: Install chromium
        run: uv run playwright install chromium

      - name: Run end-to-end tests
        run: uv run pytest tests_e2e -m e2e -v
