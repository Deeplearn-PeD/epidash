name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the coverage badge to the `badge` branch
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Type check
        run: uv run ty check epidash/

      - name: Run tests
        run: uv run pytest -v --cov=epidash --cov-report=

      - name: Check out badge branch
        uses: actions/checkout@v4
        with:
          ref: badge
          path: badge-branch

      - name: Update coverage badge
        run: |
          PCT=$(uv run coverage report --format=total)
          PCT_INT=${PCT%%.*}
          if [ "$PCT_INT" -ge 90 ]; then COLOR=brightgreen;
          elif [ "$PCT_INT" -ge 75 ]; then COLOR=green;
          elif [ "$PCT_INT" -ge 60 ]; then COLOR=yellow;
          else COLOR=red; fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > badge-branch/coverage.json
          cd badge-branch
          git config user.name "epidash-ci"
          git config user.email "ci@epidash.invalid"
          if git diff --quiet coverage.json; then
            echo "Badge unchanged (${PCT}%)"
          else
            git add coverage.json
            git commit -m "coverage badge: ${PCT}%"
            git push
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (with browser tooling)
        run: uv sync --group e2e

      - name: Install chromium
        run: uv run playwright install chromium

      - name: Run end-to-end tests
        run: uv run pytest tests_e2e -m e2e -v
