<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpiDash</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/#/">Epi<span>Dash</span></a>
    <span id="dash-status" class="status-badge" hidden></span>
  </header>

  <main id="app"></main>

  <!-- Viewer tweak panel -->
  <div id="tweak-panel" hidden>
    <button id="tweak-toggle" title="Ask EpidBot to change this dashboard">✦ Ask EpidBot</button>
    <div id="tweak-body" hidden>
      <div id="tweak-log"></div>
      <div class="tweak-input-row">
        <textarea id="tweak-input" rows="2"
          placeholder="e.g. show only the Southeast states after 2020"></textarea>
        <button id="tweak-send">Send</button>
      </div>
    </div>
  </div>

  <script src="/vendor/plotly.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
