<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpiDash</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/#/"><img class="brand-logo" src="/kwar-ai-logo.webp" alt="Kwar-AI"><span class="brand-name">Epi<span>Dash</span></span></a>
    <span id="dash-status" class="status-badge" hidden></span>
    <span id="auth-chip" class="auth-chip" data-i18n-title="sign_in"><a id="auth-link" href="/auth/login">Sign in</a></span>
  </header>

  <main id="app"></main>

  <footer class="site-footer">
    <span class="footer-copy">© 2026 <a href="https://dash.kwar-ai.com.br" target="_blank" rel="noopener">Kwar-AI</a>. <span data-i18n="footer_rights">All rights reserved.</span></span>
    <nav class="footer-links">
      <a href="https://github.com/Deeplearn-PeD/epidash" target="_blank" rel="noopener" data-i18n="footer_github">GitHub</a>
      <a href="https://github.com/Deeplearn-PeD/EpiDBot" target="_blank" rel="noopener" data-i18n="footer_epidbot">EpidBot</a>
      <a href="https://dash.kwar-ai.com.br" target="_blank" rel="noopener" data-i18n="footer_live">Live app</a>
    </nav>
  </footer>

  <!-- Viewer tweak panel -->
  <div id="tweak-panel" hidden>
    <button id="tweak-toggle" data-i18n-title="change_title" aria-label="Ask EpidBot to change this dashboard"><img class="tweak-logo" src="/epidbot.webp" alt=""></button>
    <div id="tweak-body" hidden>
      <div id="tweak-log"></div>
      <div class="tweak-input-row">
        <textarea id="tweak-input" rows="2" data-i18n-placeholder="input_placeholder"
          placeholder="Ask a question or request a change…"></textarea>
        <div class="tweak-send-col">
          <button id="ask-send" data-i18n-title="ask_title" data-i18n="ask_btn">Ask</button>
          <button id="tweak-send" data-i18n-title="change_title" data-i18n="change_btn">Change</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
